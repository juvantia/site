version: '3.8'

services:
  site:
    build: .
    container_name: site-service
    restart: always
    networks:
      - juvantia-network
    labels:
      - "traefik.enable=true"
      - "traefik.http.routers.site.rule=Host(`juvantia.org`) || Host(`www.juvantia.org`)"
      - "traefik.http.routers.site.entrypoints=websecure"
      - "traefik.http.routers.site.tls=true"
      - "traefik.http.routers.site.tls.certresolver=myresolver"
      - "traefik.http.services.site.loadbalancer.server.port=80"

      # Native passkeys: exact paths, JSON responses, and no content negotiation.
      - "traefik.http.routers.site-native-association.rule=Host(`juvantia.org`) && (Path(`/.well-known/assetlinks.json`) || Path(`/.well-known/apple-app-site-association`))"
      - "traefik.http.routers.site-native-association.entrypoints=websecure"
      - "traefik.http.routers.site-native-association.tls=true"
      - "traefik.http.routers.site-native-association.tls.certresolver=myresolver"
      - "traefik.http.routers.site-native-association.priority=200"
      - "traefik.http.routers.site-native-association.service=site"
      - "traefik.http.routers.site-native-association.middlewares=site-native-json"
      - "traefik.http.middlewares.site-native-json.headers.customrequestheaders.Accept=application/json"
      - "traefik.http.middlewares.site-native-json.headers.customresponseheaders.Content-Type=application/json"
      
      # Catch-all for robots.txt from any subdomain (low priority)
      - "traefik.http.routers.site-robots.rule=Path(`/robots.txt`) && HostRegexp(`{subdomain:[a-z0-9-]+}.juvantia.org`)"
      - "traefik.http.routers.site-robots.entrypoints=websecure"
      - "traefik.http.routers.site-robots.tls=true"
      - "traefik.http.routers.site-robots.priority=100"
      
      # HTTP to HTTPS Redirect
      - "traefik.http.routers.site-insecure.rule=Host(`juvantia.org`) || Host(`www.juvantia.org`)"
      - "traefik.http.routers.site-insecure.entrypoints=web"
      - "traefik.http.routers.site-insecure.middlewares=https-redirect@docker"

networks:
  juvantia-network:
    external: true

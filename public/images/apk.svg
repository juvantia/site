<svg xmlns="http://www.w3.org/2000/svg" width="200" height="60" viewBox="0 0 200 60">
  <defs>
    <linearGradient id="apk-bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#141a18"/>
      <stop offset="100%" stop-color="#080d0b"/>
    </linearGradient>
    <linearGradient id="apk-border" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#00FF88" stop-opacity="0.5"/>
      <stop offset="100%" stop-color="#00FF88" stop-opacity="0.2"/>
    </linearGradient>
  </defs>

  <!-- Background Pill -->
  <rect x="1" y="1" width="198" height="58" rx="10" fill="url(#apk-bg)" stroke="url(#apk-border)" stroke-width="1.5"/>

  <!-- Android Robot Logo (#32DE84) -->
  <g transform="translate(14, 18) scale(0.95)">
    <!-- Antennae -->
    <line x1="9" y1="4" x2="5" y2="0" stroke="#32DE84" stroke-width="2" stroke-linecap="round"/>
    <line x1="23" y1="4" x2="27" y2="0" stroke="#32DE84" stroke-width="2" stroke-linecap="round"/>
    <!-- Head Dome -->
    <path fill="#32DE84" d="M 4,16 A 12,12 0 0,1 28,16 Z"/>
    <!-- Eyes -->
    <circle cx="10" cy="10" r="1.5" fill="#0a0f0d"/>
    <circle cx="22" cy="10" r="1.5" fill="#0a0f0d"/>
    <!-- Body -->
    <path fill="#32DE84" d="M 4,18 L 28,18 A 2,2 0 0,1 30,20 L 30,30 A 4,4 0 0,1 26,34 L 6,34 A 4,4 0 0,1 2,30 L 2,20 A 2,2 0 0,1 4,18 Z"/>
  </g>

  <!-- Text -->
  <text x="54" y="24" font-family="'Space Grotesk', system-ui, sans-serif" font-size="8.5" font-weight="600" letter-spacing="1.5" fill="#88A090" text-transform="uppercase">DIRECT PACKAGE</text>
  <text x="54" y="43" font-family="'Cinzel', 'Space Grotesk', serif" font-size="15" font-weight="700" letter-spacing="1" fill="#00FF88" text-transform="uppercase">ANDROID APK</text>
</svg>

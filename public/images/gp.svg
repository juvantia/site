<svg xmlns="http://www.w3.org/2000/svg" width="200" height="60" viewBox="0 0 200 60">
  <defs>
    <style>
      @import url('https://fonts.googleapis.com/css2?family=Cinzel:wght@700&amp;family=Space+Grotesk:wght@600&amp;display=swap');
      .badge-sub { font-family: 'Space Grotesk', system-ui, -apple-system, sans-serif; font-size: 8.5px; font-weight: 600; letter-spacing: 1.5px; fill: #88A090; text-transform: uppercase; }
      .badge-main { font-family: 'Cinzel', serif; font-size: 15px; font-weight: 700; letter-spacing: 1px; fill: #00FF88; text-transform: uppercase; }
    </style>
    <linearGradient id="gp-bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#141a18"/>
      <stop offset="100%" stop-color="#080d0b"/>
    </linearGradient>
    <linearGradient id="gp-border" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#00FF88" stop-opacity="0.5"/>
      <stop offset="100%" stop-color="#00FF88" stop-opacity="0.2"/>
    </linearGradient>
  </defs>

  <!-- Background Pill -->
  <rect x="1" y="1" width="198" height="58" rx="10" fill="url(#gp-bg)" stroke="url(#gp-border)" stroke-width="1.5"/>

  <!-- Google Play Triangle Logo -->
  <g transform="translate(18, 14) scale(0.95)">
    <path fill="#00D4FF" d="M 3.8,1.4 C 3.4,1.8 3.2,2.4 3.2,3.2 L 3.2,28.8 C 3.2,29.6 3.4,30.2 3.8,30.6 L 3.9,30.7 L 19.3,15.3 L 3.9,1.3 Z"/>
    <path fill="#FF4757" d="M 24.5,10.1 L 19.3,15.3 L 24.5,20.5 L 29.8,17.5 C 31.3,16.6 31.3,14.0 29.8,13.1 L 24.5,10.1 Z"/>
    <path fill="#00FF88" d="M 24.5,20.5 L 19.3,15.3 L 3.9,30.7 C 4.5,31.3 5.5,31.4 6.7,30.7 L 24.5,20.5 Z"/>
    <path fill="#FFD600" d="M 24.5,10.1 L 6.7,0.0 C 5.5,-0.6 4.5,-0.5 3.9,0.1 L 19.3,15.4 L 24.5,10.1 Z"/>
  </g>

  <!-- Live Font Text -->
  <text x="54" y="24" class="badge-sub">GET IT ON</text>
  <text x="54" y="43" class="badge-main">GOOGLE PLAY</text>
</svg>
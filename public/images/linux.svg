    <ellipse cx="17" cy="23" rx="11.5" ry="16.5" fill="#101513" stroke="#E6F0EB" stroke-width="0.8"/>
    <ellipse cx="17" cy="27.2" rx="7.7" ry="10.8" fill="#E6F0EB"/>
    <ellipse cx="13.7" cy="11.4" rx="4.4" ry="5.2" fill="#E6F0EB"/>
    <ellipse cx="20.3" cy="11.4" rx="4.4" ry="5.2" fill="#E6F0EB"/>
    <circle cx="14.8" cy="11.9" r="1.25" fill="#050a09"/>
    <circle cx="19.2" cy="11.9" r="1.25" fill="#050a09"/>
    <path d="M12.2 15.1L17 12.9L21.8 15.1L17 18.8Z" fill="#F2B134"/>
    <path d="M7.5 38.1C9.3 35.9 12.2 35.5 15.8 38.4C13.1 40.8 8.6 41.7 6.6 40.3C5.9 39.8 6.3 39.1 7.5 38.1Z" fill="#F2B134"/>
    <path d="M26.5 38.1C24.7 35.9 21.8 35.5 18.2 38.4C20.9 40.8 25.4 41.7 27.4 40.3C28.1 39.8 27.7 39.1 26.5 38.1Z" fill="#F2B134"/>
  </g>

  <!-- Live Font Text -->
  <text x="54" y="24" class="badge-sub">GET IT FOR</text>
  <text x="54" y="43" class="badge-main">LINUX</text>
</svg>

<svg xmlns="http://www.w3.org/2000/svg" width="200" height="60" viewBox="0 0 200 60">
  <defs>
    <style>
      @import url('https://fonts.googleapis.com/css2?family=Cinzel:wght@700&amp;family=Space+Grotesk:wght@600&amp;display=swap');
      .badge-sub { font-family: 'Space Grotesk', system-ui, -apple-system, sans-serif; font-size: 8.5px; font-weight: 600; letter-spacing: 1.5px; fill: #88A090; text-transform: uppercase; }
      .badge-main { font-family: 'Cinzel', serif; font-size: 15px; font-weight: 700; letter-spacing: 1px; fill: #00FF88; text-transform: uppercase; }
    </style>
    <linearGradient id="linux-bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#141a18"/>
      <stop offset="100%" stop-color="#080d0b"/>
    </linearGradient>
    <linearGradient id="linux-border" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#00FF88" stop-opacity="0.5"/>
      <stop offset="100%" stop-color="#00FF88" stop-opacity="0.2"/>
    </linearGradient>
  </defs>

  <!-- Background Pill -->
  <rect x="1" y="1" width="198" height="58" rx="10" fill="url(#linux-bg)" stroke="url(#linux-border)" stroke-width="1.5"/>

  <!-- Linux Penguin -->
  <image href="/images/linux-logo.svg" x="14" y="8" width="34" height="40" preserveAspectRatio="xMidYMid meet"/>

  <!-- Live Font Text -->
  <text x="54" y="24" class="badge-sub">GET IT FOR</text>
  <text x="54" y="43" class="badge-main">LINUX</text>
</svg>
